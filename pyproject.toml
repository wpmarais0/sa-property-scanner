[tool.poetry]
name = "sa-property-scanner"
version = "0.1.0"
description = "Autonomous property scanner for South African real estate (Western Cape / Garden Route)"
authors = ["User <user@example.com>"]
readme = "README.md"
packages = [{ include = "sa_property_scanner", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
# Web scraping & HTTP
requests = "^2.31.0"
httpx = { extras = ["http2"], version = "^0.27.0" }
beautifulsoup4 = "^4.12.3"
playwright = "^1.42.0"
playwright-stealth = "^1.0.6"
feedparser = "^6.0.11"
# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.29" }
alembic = "^1.13.1"
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
# Validation & settings
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
# CLI
click = "^8.1.7"
# Notifications
python-telegram-bot = "^21.0.1"
discord-webhook = "^1.3.1"
aiosmtplib = "^3.0.1"
# Resilience & utilities
tenacity = "^8.2.3"
python-json-logger = "^2.0.7"
# Async
asyncio = "^3.4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
respx = "^0.22.0"
factory-boy = "^3.3.0"
ruff = "^0.3.7"
mypy = "^1.9.0"
pre-commit = "^3.7.0"

[tool.poetry.scripts]
property-scanner = "sa_property_scanner.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=sa_property_scanner --cov-report=term-missing"
